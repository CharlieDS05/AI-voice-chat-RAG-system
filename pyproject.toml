[tool.ruff]
line-length = 100
target-version = "py312"   

[tool.ruff.lint]
# E,F = core errors; I = import sorting; B = common bug patterns; UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: loads ML models; slower (deselect with '-m \"not integration\"')",
]
name: quality-gate

on:
  pull_request:
  workflow_dispatch:   # manual trigger button, for testing the workflow itself

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # Generation runs hosted in CI (no Ollama on GitHub runners);
      # the provider switch makes this a pure configuration decision.
      LLM_PROVIDER: hosted
      HOSTED_BASE_URL: https://api.groq.com/openai/v1
      HOSTED_MODEL: llama-3.1-8b-instant
      HOSTED_API_KEY: ${{ secrets.GROQ_API_KEY }}
      JUDGE_BASE_URL: https://api.groq.com/openai/v1
      JUDGE_MODEL: llama-3.3-70b-versatile
      JUDGE_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Build CI corpus and index
        run: |
          python -m scripts.make_ci_corpus
          python -m scripts.build_index data/ci/ci_corpus.pdf

      - name: Run quality gate
        run: python -m evaluation.gate --golden evaluation/ci_golden.yaml